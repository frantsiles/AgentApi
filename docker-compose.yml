version: '3.8'
services:
  agentapi:
    build:
      context: .
      dockerfile: src/Agent.Api/Dockerfile
    image: agentapi:latest
    container_name: agentapi
    environment:
      - ApiKey=change-me
      - Agent__RootPath=/workspace
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__Model=llama3.1:8b
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant:/qdrant/storage
volumes:
  ollama:
  qdrant:
